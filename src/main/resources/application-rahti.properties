# Profile for the CSC Rahti deployment. Activate with SPRING_PROFILES_ACTIVE=rahti.
# The database is a PostgreSQL instance on CSC Pukki all values come from environment variables.
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_SERVICE_HOST}:${POSTGRESQL_SERVICE_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
whichone.jwt.require-secret=true
server.address=0.0.0.0